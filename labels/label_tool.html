<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Road PCI - Human Pair Labeling Tool</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: var(--card-bg);
    }
    .btn-success {
      background: var(--accent);
      color: #fff;
    }
    .btn-success:hover {
      background: #059669;
    }
    .progress-bar-container {
      width: 220px;
      background: var(--card-bg);
      border-radius: 9999px;
      height: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }
    .progress-text {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent);
    }
    .page-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-tab {
      padding: 6px 14px;
      border-radius: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .page-tab:hover {
      color: #fff;
      border-color: var(--primary);
    }
    .page-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .page-tab.complete {
      border-color: var(--accent);
      color: var(--accent);
    }
    .page-tab.active.complete {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .image-preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 24px;
      text-align: center;
    }
    .image-preview-card img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .pairs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .pair-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s;
    }
    .pair-card.answered {
      border-color: var(--accent);
    }
    .pair-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pair-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }
    .pair-status {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #334155;
      color: var(--text-muted);
    }
    .pair-status.done {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
    }
    .choice-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .choice-btn {
      padding: 10px 4px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: #0f172a;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .choice-btn:hover {
      border-color: var(--primary);
      background: #1e293b;
    }
    .choice-btn.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .choice-btn.selected.same {
      background: #64748b;
      border-color: #64748b;
      color: #fff;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      margin-bottom: 40px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--accent);
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <header>
      <div>
        <h1>Road Distress Human Pair Labeling</h1>
        <p class="subtitle">Blind comparison: Select which road pavement is <strong>Worse</strong> (more deteriorated / repair sooner).</p>
      </div>
      <div class="header-actions">
        <div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="progress-text" id="progress-text">0 / 60 labeled</div>
        <button class="btn btn-success" id="download-btn" onclick="downloadCSV()">Download pairs_human.csv</button>
      </div>
    </header>

    <div class="page-nav" id="page-tabs"></div>

    <div class="image-preview-card">
      <img id="page-image" src="" alt="Pair Sheet Page" />
    </div>

    <div class="pairs-grid" id="pairs-grid"></div>

    <div class="bottom-nav">
      <button class="btn btn-outline" id="prev-btn" onclick="prevPage()">&larr; Previous Page</button>
      <span id="page-indicator" style="font-weight: 600; color: var(--text-muted);">Page 1 of 10</span>
      <button class="btn btn-outline" id="next-btn" onclick="nextPage()">Next Page &rarr;</button>
    </div>
  </div>

  <div class="toast" id="toast">Saved!</div>

    let currentPage = 1;
    const STORAGE_KEY = 'road_pci_human_labels_v1';
    let labels = {};

    // Load saved labels from localStorage
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        labels = JSON.parse(saved);
      }
    } catch (e) {
      console.warn('LocalStorage error:', e);
    }

    function saveLabels() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(labels));
      } catch (e) {}
      updateProgress();
      renderTabs();
    }

    function setLabel(pairId, val) {
      labels[pairId] = val;
      saveLabels();
      renderPairs();
    }

    function updateProgress() {
      const count = Object.keys(labels).filter(k => labels[k] && labels[k].trim() !== '').length;
      const pct = Math.round((count / PAIRS.length) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-text').innerText = count + ' / ' + PAIRS.length + ' labeled (' + pct + '%)';
    }

    function renderTabs() {
      const container = document.getElementById('page-tabs');
      container.innerHTML = '';
      for (let p = 1; p <= 10; p++) {
        const btn = document.createElement('button');
        btn.className = 'page-tab' + (p === currentPage ? ' active' : '');
        // Check if all pairs on page are labeled
        const pagePairs = PAIRS.filter(item => item.page === p);
        const complete = pagePairs.every(item => labels[item.pair_id] && labels[item.pair_id].trim() !== '');
        if (complete) btn.classList.add('complete');
        btn.innerText = 'Page ' + p + (complete ? ' ✓' : '');
        btn.onclick = () => goToPage(p);
        container.appendChild(btn);
      }
    }

    function renderPage() {
      document.getElementById('page-indicator').innerText = 'Page ' + currentPage + ' of 10';
      const pageStr = String(currentPage).padStart(2, '0');
      document.getElementById('page-image').src = 'pair_sheet_page_' + pageStr + '.png';
      
      document.getElementById('prev-btn').disabled = (currentPage === 1);
      document.getElementById('next-btn').disabled = (currentPage === 10);
      
      renderTabs();
      renderPairs();
    }

    function renderPairs() {
      const container = document.getElementById('pairs-grid');
      container.innerHTML = '';
      const pagePairs = PAIRS.filter(item => item.page === currentPage);

      pagePairs.forEach(item => {
        const currentVal = labels[item.pair_id] || '';
        const card = document.createElement('div');
        card.className = 'pair-card' + (currentVal ? ' answered' : '');

        const header = document.createElement('div');
        header.className = 'pair-header';
        header.innerHTML = '<span class="pair-title">' + item.pair_id + '</span>' +
          '<span class="pair-status ' + (currentVal ? 'done' : '') + '">' +
          (currentVal ? 'Selected: ' + currentVal : 'Unlabeled') + '</span>';
        card.appendChild(header);

        const group = document.createElement('div');
        group.className = 'choice-group';

        const optA = document.createElement('button');
        optA.className = 'choice-btn' + (currentVal === 'A' ? ' selected' : '');
        optA.innerHTML = '<strong>A (Left)</strong>';
        optA.onclick = () => setLabel(item.pair_id, 'A');

        const optSame = document.createElement('button');
        optSame.className = 'choice-btn' + (currentVal === 'same' ? ' selected same' : '');
        optSame.innerHTML = '<strong>Same</strong>';
        optSame.onclick = () => setLabel(item.pair_id, 'same');

        const optB = document.createElement('button');
        optB.className = 'choice-btn' + (currentVal === 'B' ? ' selected' : '');
        optB.innerHTML = '<strong>B (Right)</strong>';
        optB.onclick = () => setLabel(item.pair_id, 'B');

        group.appendChild(optA);
        group.appendChild(optSame);
        group.appendChild(optB);
        card.appendChild(group);

        container.appendChild(card);
      });
    }

    function goToPage(p) {
      currentPage = p;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevPage() {
      if (currentPage > 1) goToPage(currentPage - 1);
    }

    function nextPage() {
      if (currentPage < 10) goToPage(currentPage + 1);
    }

    function downloadCSV() {
      const count = Object.keys(labels).filter(k => labels[k] && labels[k].trim() !== '').length;
      if (count < PAIRS.length) {
        const confirmDownload = confirm('Notice: Only ' + count + ' of ' + PAIRS.length + ' pairs are labeled. Download anyway?');
        if (!confirmDownload) return;
      }

      let csv = 'pair_id,image_a,image_b,worse\n';
      PAIRS.forEach(item => {
        const worse = labels[item.pair_id] || '';
        csv += item.pair_id + ',' + item.image_a + ',' + item.image_b + ',' + worse + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'pairs_human.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Init
    updateProgress();
    renderPage();
  </script>
